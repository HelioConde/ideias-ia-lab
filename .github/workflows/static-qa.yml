name: Lab QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: |
          node --check data.js
          node --check assets/app.js
          node --check supabase-config.js
          node --check 02-vaga-certa/app.js
          node --check 04-monta-pc/app.js
          node --check 05-caça-game/app.js
          node --check 09-revisa-ai/app.js
      - name: Validate product pages
        run: |
          set -e
          for page in             02-vaga-certa             03-entrevista-fluente             04-monta-pc             05-caça-game             07-perto-de-mim             08-prato-pronto             09-revisa-ai
          do
            test -f "$page/index.html"
            grep -qi '<title' "$page/index.html"
            grep -qi 'meta name="description"' "$page/index.html"
            grep -qi 'rel="canonical"' "$page/index.html"
            grep -qi 'supabase-config.js' "$page/index.html"
          done
          test -f 02-vaga-certa/style.css
          test -f 04-monta-pc/style.css
          test -f 05-caça-game/style.css
          test -f 09-revisa-ai/style.css
          grep -qi '02-vaga-certa/app.js\|src="app.js"' 02-vaga-certa/index.html
          grep -qi '04-monta-pc/app.js\|src="app.js"' 04-monta-pc/index.html
          grep -qi '05-caça-game/app.js\|src="app.js"' 05-caça-game/index.html
          grep -qi '09-revisa-ai/app.js\|src="app.js"' 09-revisa-ai/index.html
          exit 0