name: Organizer QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate organizer hub
        run: |
          set -e
          test -f index.html
          test -f assets/style.css
          test -f README.md
          test -f SPLIT_REPOS.md
          grep -qi '<title' index.html
          grep -qi 'Hub de organização' index.html
          grep -qi 'somente o hub de organização' README.md
          for forbidden in data.js supabase-config.js assets/app.js 01-studio-social 02-vaga-certa 03-entrevista-fluente 04-monta-pc 05-caça-game 06-hora-marcada 07-perto-de-mim 08-prato-pronto 09-revisa-ai 10-doc-pronto supabase
          do
            test ! -e "$forbidden"
          done

      - name: Validate migration script
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/create-split-repos.ps1"),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

          $script = Get-Content "scripts/create-split-repos.ps1" -Raw
          @(
            "split/vagacerta",
            "split/falapro",
            "split/montapc",
            "split/gameradar",
            "split/perto",
            "split/pratopronto",
            "split/revisa"
          ) | ForEach-Object {
            if (-not $script.Contains($_)) {
              throw "Branch de migração ausente do script: $_"
            }
          }
