name: Auditoria visual multiprojeto GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'scripts/pages-targets.json'
      - 'scripts/pages-visual-qa.mjs'
      - '.github/workflows/pages-visual-qa.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/pages-targets.json'
      - 'scripts/pages-visual-qa.mjs'
      - '.github/workflows/pages-visual-qa.yml'
  workflow_dispatch:
  schedule:
    - cron: '20 9 * * 1'

permissions:
  contents: read

jobs:
  pages-visual-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reaproveitar navegador entre execuções
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-headless-shell-v1.56.1
      - name: Instalar Playwright e shell headless (sem Chromium completo)
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps --only-shell chromium
      - name: Verificar sintaxe e configuração
        run: |
          node --check scripts/pages-visual-qa.mjs
          node -e "const cfg=require('./scripts/pages-targets.json');if(!cfg.sites.length||!cfg.viewports.length)process.exit(1)"
      - name: Capturar e analisar sites publicados
        run: node scripts/pages-visual-qa.mjs --strict
      - name: Guardar capturas e diagnósticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-visual-audit
          path: artifacts/pages-visual-audit/
          retention-days: 14
          if-no-files-found: warn
